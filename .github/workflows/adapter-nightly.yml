name: Adapter Nightly Run

on:
  schedule:
    # Run every day at 03:00 KST (18:00 UTC previous day)
    - cron: '0 18 * * *'

jobs:
  run-adapter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies (if any)
        run: |
          python -m pip install --upgrade pip
      - name: Run adapter (no-op if no input)
        run: |
          if [ -f ./scraped/latest.json ]; then
            python adapter_polymarket.py ./scraped/latest.json
          else
            echo "No scraped input found; skip"
          fi
